type: custom:button-card
entity: sensor.flex_status
show_icon: false
show_name: false
show_state: false
grid_options:
  columns: full
tap_action:
  action: none
extra_styles: |
  [[[
    const s = id => states[id].state;
    const leak = ['binary_sensor.water_leak_combi','binary_sensor.water_leak_fish','binary_sensor.water_leak_bathroom'].some(i => s(i) === 'on');
    const smoke = s('switch.smoke') === 'on';
    const doors = Number(s('sensor.doors_open_amount')) > 0;
    const bg = (leak || smoke)
      ? 'linear-gradient(135deg, rgba(255,95,95,0.6), rgba(255,205,205,0.55))'
      : doors
        ? 'linear-gradient(135deg, rgba(255,196,102,0.55), rgba(255,244,225,0.65))'
        : 'linear-gradient(135deg, rgba(125,205,175,0.5), rgba(244,249,255,0.65))';
    const anim = (leak || smoke) ? 'pulse 1.6s infinite' : 'none';
    return `
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(255,60,60,0.5); }
        70% { box-shadow: 0 0 0 14px rgba(255,60,60,0); }
        100% { box-shadow: 0 0 0 0 rgba(255,60,60,0); }
      }
      ha-card { background: ${bg} !important; animation: ${anim}; }
    `;
  ]]]
styles:
  card:
    - padding: 16px 20px
    - width: 100%
  grid:
    - grid-template-areas: '"hello weather" "main alarm" "doors alarm" "batt alarm"'
    - grid-template-columns: minmax(0, 1fr) auto
    - grid-template-rows: auto auto auto auto
    - row-gap: 0
  custom_fields:
    hello:
      - justify-self: start
      - text-align: left
      - min-width: 0
      - margin-bottom: 12px
    weather:
      - justify-self: end
      - align-self: start
      - margin-top: -4px
    main:
      - justify-self: start
      - min-width: 0
    doors:
      - justify-self: start
      - min-width: 0
    batt:
      - justify-self: start
      - min-width: 0
    alarm:
      - justify-self: end
      - align-self: center
custom_fields:
  hello: |
    [[[
      const d = new Date();
      const day = d.getDate();
      const suffix = (day % 10 === 1 && day !== 11) ? 'st'
        : (day % 10 === 2 && day !== 12) ? 'nd'
        : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
      const weekday = d.toLocaleDateString('en-GB', { weekday: 'long' });
      const month = d.toLocaleDateString('en-GB', { month: 'long' });
      return `
        <div style="font-size:18px;color:var(--secondary-text-color)">Welcome back,</div>
        <div style="font-size:24px;font-weight:600;color:var(--primary-text-color);line-height:1.2">${hass.user.name}</div>
        <div style="font-size:18px;color:var(--secondary-text-color);margin-top:4px">${weekday} ${day}${suffix} ${month}</div>
      `;
    ]]]
  weather: |
    [[[
      const w = states['weather.forecast_home'];
      const icons = {
        'sunny': 'mdi:weather-sunny',
        'clear-night': 'mdi:weather-night',
        'cloudy': 'mdi:weather-cloudy',
        'partlycloudy': 'mdi:weather-partly-cloudy',
        'rainy': 'mdi:weather-rainy',
        'pouring': 'mdi:weather-pouring',
        'snowy': 'mdi:weather-snowy',
        'snowy-rainy': 'mdi:weather-snowy-rainy',
        'fog': 'mdi:weather-fog',
        'windy': 'mdi:weather-windy',
        'windy-variant': 'mdi:weather-windy-variant',
        'hail': 'mdi:weather-hail',
        'lightning': 'mdi:weather-lightning',
        'lightning-rainy': 'mdi:weather-lightning-rainy',
        'exceptional': 'mdi:alert-circle-outline'
      };
      const icon = icons[w.state] || 'mdi:weather-cloudy';
      const temp = Math.round(w.attributes.temperature);
      const unit = w.attributes.temperature_unit || '°C';
      return `
        <div style="display:flex;align-items:center;gap:8px">
          <ha-icon icon="${icon}" style="--mdc-icon-size:38px;color:#4A90E2"></ha-icon>
          <span style="font-size:24px;font-weight:600;color:var(--primary-text-color)">${temp}${unit}</span>
        </div>
      `;
    ]]]
  main:
    card:
      type: custom:button-card
      entity: switch.smoke
      show_icon: false
      show_state: false
      tap_action:
        action: none
      name: |
        [[[
          const s = id => states[id].state;
          const L = {
            'binary_sensor.water_leak_combi': 'Combi',
            'binary_sensor.water_leak_fish': 'Fish tank',
            'binary_sensor.water_leak_bathroom': 'Bathroom'
          };
          const leaks = Object.keys(L).filter(i => s(i) === 'on').map(i => L[i]);
          const smoke = s('switch.smoke') === 'on';
          let m = smoke ? '🔥 Smoke alarm active!' : leaks.length ? '💧 Water leak: ' + leaks.join(', ') : '✅ All clear';
          if (smoke && leaks.length) m += ' · 💧 ' + leaks.join(', ');
          return m;
        ]]]
      styles:
        card:
          - background: none
          - box-shadow: none !important
          - border: none
          - backdrop-filter: none
          - overflow: visible
          - cursor: default
          - padding: 2px 6px 2px 4px
        name:
          - font-size: 15px
          - font-weight: 600
          - line-height: 1.3
          - color: var(--primary-text-color)
          - justify-self: start
          - text-align: left
          - white-space: normal
  doors:
    card:
      type: custom:button-card
      entity: sensor.doors_open_amount
      show_icon: false
      show_state: false
      tap_action:
        action: more-info
      name: |
        [[[
          const s = id => states[id].state;
          const D = {
            'binary_sensor.living_room_door_contact': 'Living room door',
            'binary_sensor.back_door': 'Back door',
            'binary_sensor.front_door': 'Front door'
          };
          const open = Object.keys(D).filter(i => s(i) === 'on').map(i => D[i]);
          const n = Number(s('sensor.doors_open_amount'));
          if (open.length) return '🚪 Open: ' + open.join(', ');
          if (n > 0) return '🚪 ' + n + ' door' + (n === 1 ? '' : 's') + ' open';
          return '🔒 All doors closed';
        ]]]
      styles:
        card:
          - background: none
          - box-shadow: none !important
          - border: none
          - backdrop-filter: none
          - overflow: visible
          - padding: 2px 6px 2px 4px
        name:
          - font-size: 15px
          - line-height: 1.3
          - color: var(--secondary-text-color)
          - justify-self: start
          - text-align: left
          - white-space: normal
  batt:
    card:
      type: custom:button-card
      entity: sensor.battery_levels
      show_icon: false
      show_state: false
      tap_action:
        action: more-info
      name: |
        [[[
          const members = states['sensor.battery_levels'].attributes.entity_id || [];
          const low = members
            .map(id => states[id])
            .filter(e => e && !isNaN(parseFloat(e.state)) && parseFloat(e.state) < 20)
            .map(e => (e.attributes.friendly_name || e.entity_id) + ' ' + Math.round(parseFloat(e.state)) + '%');
          return low.length ? '🪫 Low battery: ' + low.join(', ') : '';
        ]]]
      styles:
        card:
          - background: none
          - box-shadow: none !important
          - border: none
          - backdrop-filter: none
          - overflow: visible
          - padding: 2px 6px 2px 4px
          - display: |
              [[[
                const members = states['sensor.battery_levels'].attributes.entity_id || [];
                const any = members.some(id => states[id] && !isNaN(parseFloat(states[id].state)) && parseFloat(states[id].state) < 20);
                return any ? 'block' : 'none';
              ]]]
        name:
          - font-size: 15px
          - font-weight: 600
          - line-height: 1.3
          - color: '#D9622B'
          - justify-self: start
          - text-align: left
          - white-space: normal
          - padding-left: 1.6em
          - text-indent: -1.6em
  alarm:
    card:
      type: custom:button-card
      entity: sensor.flex_status
      layout: icon_name
      show_state: false
      tap_action:
        action: more-info
      icon: |
        [[[
          const st = states['sensor.flex_status'].state;
          return st === 'Set' ? 'mdi:shield-lock' : st === 'Part Set' ? 'mdi:shield-half-full' : 'mdi:shield-off-outline';
        ]]]
      name: |
        [[[
          const st = states['sensor.flex_status'].state;
          const map = { 'Unset': 'Disarmed', 'Part Set': 'Part set', 'Set': 'Armed' };
          return map[st] || st;
        ]]]
      styles:
        grid:
          - grid-template-columns: auto auto
          - column-gap: 6px
          - justify-content: center
          - align-items: center
        card:
          - background: rgba(255,255,255,0.6)
          - box-shadow: none !important
          - border: none
          - backdrop-filter: none
          - border-radius: 999px
          - padding: 6px 14px
        icon:
          - width: 20px
          - color: |
              [[[
                const st = states['sensor.flex_status'].state;
                return st === 'Set' ? '#2E9E6B' : st === 'Part Set' ? '#E08A1E' : '#7D8FA5';
              ]]]
        name:
          - font-size: 15px
          - font-weight: 600
          - color: |
              [[[
                const st = states['sensor.flex_status'].state;
                return st === 'Set' ? '#2E9E6B' : st === 'Part Set' ? '#E08A1E' : '#7D8FA5';
              ]]]
