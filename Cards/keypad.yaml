type: custom:button-card
entity: sensor.galaxy_vkp_line1
triggers_update:
  - sensor.galaxy_vkp_line1
  - sensor.galaxy_vkp_line2
show_icon: false
show_name: false
show_state: false
tap_action:
  action: none
styles:
  card:
    - padding: 14px
    - user-select: none
    - -webkit-user-select: none
    - -webkit-touch-callout: none
    - -webkit-tap-highlight-color: transparent
  grid:
    - grid-template-areas: >-
        "lcd lcd lcd lcd" "k1 k2 k3 ka" "k4 k5 k6 kb" "k7 k8 k9 ke" "ks k0 kh
        kx"
    - grid-template-columns: repeat(4, minmax(0, 1fr))
    - grid-template-rows: auto auto auto auto auto
    - gap: 10px
  custom_fields:
    lcd:
      - justify-self: stretch
custom_fields:
  lcd: |
    [[[
      const clean = id => {
        const s = states[id] ? states[id].state : '';
        return (s === 'unknown' || s === 'unavailable') ? '' : s;
      };
      const l1 = clean('sensor.galaxy_vkp_line1');
      const l2 = clean('sensor.galaxy_vkp_line2');
      const line = t => `<div style="font-family:'Courier New',monospace;font-size:20px;line-height:26px;min-height:26px;letter-spacing:1px;color:#D8ECFF;text-shadow:0 0 6px rgba(140,200,255,0.6);white-space:pre;overflow:hidden;text-align:left">${t}</div>`;
      return `
        <div style="background:linear-gradient(160deg,#1E3A5F,#2E5C8A);border-radius:14px;padding:12px 16px;border:1px solid rgba(255,255,255,0.3);box-shadow:inset 0 2px 8px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.7)">
          ${line(l1)}
          ${line(l2)}
        </div>
      `;
    ]]]
  k1:
    card:
      type: custom:button-card
      show_icon: false
      show_state: false
      name: '1'
      tap_action:
        action: call-service
        service: mqtt.publish
        service_data:
          payload: '1'
          topic: YOUR TOPIC ADDRESS HERE
      variables:
        border: rgba(255,255,255,0.9)
        text: '#1F2D3D'
      styles:
        card:
          - height: 52px
          - border-radius: 14px
          - padding: 0
          - background: rgba(244, 249, 255, 0.85)
          - border: '[[[ return "2px solid " + variables.border; ]]]'
          - box-shadow: >-
              rgba(0, 0, 0, 0.4) 0px 2px 4px, rgba(0, 0, 0, 0.3) 0px 2px 13px
              -1px, rgba(0, 0, 0, 0.2) 0px -3px 5px inset !important;
        name:
          - font-size: 20px
          - font-weight: 600
          - color: '[[[ return variables.text; ]]]'
  k2:
    card:
      type: custom:button-card
